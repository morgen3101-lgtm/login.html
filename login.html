<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NEXORA - Log In</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {

      min-height: 100vh;

      background:
        linear-gradient(
          135deg,
          #5b5cf0,
          #7c3aed
        );

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .login-box {

      width: 100%;
      max-width: 420px;

      background: white;

      padding: 35px;

      border-radius: 22px;

      box-shadow:
        0 15px 40px
        rgba(0,0,0,0.2);
    }

    .logo {

      text-align: center;

      color: #5b5cf0;

      font-size: 30px;

      font-weight: 800;

      margin-bottom: 8px;
    }

    .subtitle {

      text-align: center;

      color: #777;

      margin-bottom: 25px;
    }

    .input-group {

      margin-bottom: 17px;
    }

    label {

      display: block;

      margin-bottom: 7px;

      font-weight: bold;

      color: #333;
    }

    input {

      width: 100%;

      padding: 13px;

      border: 1px solid #ddd;

      border-radius: 12px;

      outline: none;

      font-size: 15px;
    }

    input:focus {

      border-color: #5b5cf0;
    }

    .password-box {

      position: relative;
    }

    .password-box input {

      padding-right: 45px;
    }

    .show-password {

      position: absolute;

      right: 12px;

      top: 12px;

      border: none;

      background: none;

      cursor: pointer;

      color: #777;
    }

    .forgot {

      display: block;

      text-align: right;

      color: #5b5cf0;

      text-decoration: none;

      font-size: 14px;

      margin-bottom: 18px;
    }

    .login-btn {

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 12px;

      background: #5b5cf0;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }

    .login-btn:hover {

      opacity: 0.9;
    }

    .divider {

      display: flex;

      align-items: center;

      gap: 10px;

      margin: 22px 0;

      color: #999;

      font-size: 13px;
    }

    .divider::before,
    .divider::after {

      content: "";

      height: 1px;

      background: #ddd;

      flex: 1;
    }

    .signup {

      text-align: center;

      color: #777;
    }

    .signup a {

      color: #5b5cf0;

      text-decoration: none;

      font-weight: bold;
    }

    .back {

      display: block;

      text-align: center;

      margin-top: 18px;

      color: #777;

      text-decoration: none;

      font-size: 14px;
    }

  </style>

</head>


<body>

  <div class="login-box">

    <div class="logo">
      NEXORA
    </div>

    <p class="subtitle">
      Welcome back
    </p>


    <form onsubmit="login(event)">

      <div class="input-group">

        <label>
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

      </div>


      <div class="input-group">

        <label>
          Password
        </label>

        <div class="password-box">

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword()"
          >
            👁
          </button>

        </div>

      </div>


      <a
        href="#"
        class="forgot"
      >
        Forgot password?
      </a>


      <button
        class="login-btn"
        type="submit"
      >
        Log In
      </button>

    </form>


    <div class="divider">
      OR
    </div>


    <div class="signup">

      Don't have an account?

      <a href="signup.html">
        Create New Account
      </a>

    </div>


    <a
      href="index.html"
      class="back"
    >
      ← Back to NEXORA
    </a>

  </div>


  <script>

    function togglePassword() {

      const password =
        document.getElementById("password");

      if (
        password.type === "password"
      ) {

        password.type = "text";

      } else {

        password.type = "password";

      }
    }


    function login(event) {

      event.preventDefault();

      alert(
        "The real login system will be connected next."
      );

    }

  </script>

</body>

</html>
