<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA - Create Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #5b5cf0, #7c3aed);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .signup-box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px;
      border-radius: 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      color: #5b5cf0;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #5b5cf0;
    }

    .signup-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #5b5cf0;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .signup-btn:hover {
      opacity: 0.9;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #777;
    }

    .login a {
      color: #5b5cf0;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #777;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="signup-box">

    <div class="logo">NEXORA</div>

    <p class="subtitle">Create your account</p>

    <form onsubmit="createAccount(event)">

      <div class="input-group">
        <label>Full Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your name"
          required
        >
      </div>

      <div class="input-group">
        <label>Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="input-group">
        <label>Password</label>
        <input
          type="password"
          id="password"
          placeholder="Create a password"
          minlength="6"
          required
        >
      </div>

      <div class="input-group">
        <label>Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm your password"
          minlength="6"
          required
        >
      </div>

      <button class="signup-btn" type="submit">
        Create Account
      </button>

    </form>

    <div class="login">
      Already have an account?
      <a href="login.html">Log In</a>
    </div>

    <a class="back" href="index.html">
      ← Back to NEXORA
    </a>

  </div>

  <script>
    function createAccount(event) {

      event.preventDefault();

      const name =
        document.getElementById("name").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      alert(
        "Account created successfully! Real account authentication will be added next."
      );

    }
  </script>

</body>
</html>
