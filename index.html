<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXORA - Social Network</title>

  <link

    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6fb;
      color: #222;
    }

    header {
      height: 70px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      color: #5b5cf0;
      letter-spacing: 1px;
    }

    .search {
      width: 320px;
      position: relative;
    }

    .search input {
      width: 100%;
      padding: 12px 15px 12px 42px;
      border: none;
      background: #f1f3f8;
      border-radius: 25px;
      outline: none;
    }

    .search i {
      position: absolute;
      left: 15px;
      top: 13px;
      color: #777;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: #f1f3f8;
      cursor: pointer;
      color: #555;
    }

    .login-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 12px;
      background: #5b5cf0;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }

    .login-link:hover {
      opacity: 0.9;
    }

    .layout {
      max-width: 1400px;
      margin: auto;
      display: grid;
      grid-template-columns: 230px 1fr 280px;
      gap: 25px;
      padding: 25px;
    }

    .sidebar,
    .right-sidebar,
    .create-post,
    .post {
      background: white;
      border-radius: 18px;
    }

    .sidebar {
      padding: 18px;
      height: fit-content;
      position: sticky;
      top: 95px;
    }

    .sidebar a {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: #555;
      padding: 13px;
      border-radius: 12px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background: #eeeeff;
      color: #5b5cf0;
    }

    .create-post {
      padding: 20px;
      margin-bottom: 20px;
    }

    .create-top {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #5b5cf0;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }
